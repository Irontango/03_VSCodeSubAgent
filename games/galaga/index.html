<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>갤러그 (Galaga)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #05050f;
    color: #e8e8ff;
    font-family: "Courier New", Courier, monospace;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    touch-action: none;
  }
  #wrap { position: relative; }
  canvas {
    display: block;
    background: #05050f;
    image-rendering: pixelated;
    box-shadow: 0 0 40px rgba(80, 120, 255, 0.25);
    max-width: 100vw;
    max-height: 100vh;
  }
  #help {
    position: absolute; left: 0; right: 0; bottom: -28px;
    text-align: center; font-size: 12px; color: #667;
  }
  #touch {
    position: absolute; left: 0; right: 0; bottom: 0; top: 0;
    display: none;
  }
  #touch .btn {
    position: absolute; bottom: 12px; width: 64px; height: 64px;
    border-radius: 50%; border: 2px solid rgba(255,255,255,0.35);
    background: rgba(255,255,255,0.08); user-select: none;
  }
  #tl { left: 12px; } #tr { left: 88px; } #tf { right: 12px; }
  @media (pointer: coarse) { #touch { display: block; } #help { display: none; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="480" height="640"></canvas>
  <div id="touch">
    <div class="btn" id="tl"></div>
    <div class="btn" id="tr"></div>
    <div class="btn" id="tf"></div>
  </div>
  <div id="help">← → 이동 &nbsp;|&nbsp; SPACE 발사 &nbsp;|&nbsp; P 일시정지 &nbsp;|&nbsp; ENTER 시작/재시작</div>
</div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // ---------- 상태 ----------
  const STATE = { TITLE: 0, PLAYING: 1, PAUSED: 2, GAMEOVER: 3, WAVE_CLEAR: 4 };
  let state = STATE.TITLE;
  let score = 0, hiScore = Number(localStorage.getItem('galaga_hi') || 0);
  let lives = 3, wave = 1;
  let stateTimer = 0;

  const keys = {};
  const player = { x: W / 2, y: H - 50, w: 28, h: 24, speed: 260, cooldown: 0, dead: false, respawnTimer: 0, invincible: 0 };
  let bullets = [];       // 플레이어 탄
  let enemyBullets = [];  // 적 탄
  let enemies = [];
  let particles = [];
  let stars = [];
  let diveTimer = 0;
  let formationT = 0;     // 대형 좌우 흔들림 시간

  // ---------- 별 배경 ----------
  for (let i = 0; i < 90; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 1.6 + 0.4, v: Math.random() * 40 + 20 });
  }

  // ---------- 사운드 (WebAudio, 파일 없이 합성) ----------
  let audio = null;
  function beep(freq, dur, type = 'square', vol = 0.08, slide = 0) {
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, audio.currentTime);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), audio.currentTime + dur);
      g.gain.setValueAtTime(vol, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
      o.connect(g); g.connect(audio.destination);
      o.start(); o.stop(audio.currentTime + dur);
    } catch (e) { /* 오디오 미지원 무시 */ }
  }

  // ---------- 적 정의 ----------
  // type: 0=보스(초록, 2HP, 150점) 1=나비(빨강, 80점) 2=벌(파랑, 50점)
  const ENEMY_DEF = [
    { color: '#4cff6a', color2: '#1f9c3a', hp: 2, score: 150, diveScore: 400 },
    { color: '#ff4c6a', color2: '#b0203c', hp: 1, score: 80,  diveScore: 160 },
    { color: '#4cb8ff', color2: '#2060b0', hp: 1, score: 50,  diveScore: 100 },
  ];

  function buildWave(n) {
    enemies = [];
    const rows = [
      { type: 0, count: 4 },
      { type: 1, count: 8 },
      { type: 1, count: 8 },
      { type: 2, count: 10 },
      { type: 2, count: 10 },
    ];
    const spacingX = 38, spacingY = 36, top = 70;
    rows.forEach((row, r) => {
      const totalW = (row.count - 1) * spacingX;
      for (let i = 0; i < row.count; i++) {
        const fx = W / 2 - totalW / 2 + i * spacingX;
        const fy = top + r * spacingY;
        // 진입 연출: 화면 밖에서 대형 위치로 날아옴
        const side = (i % 2 === 0) ? -1 : 1;
        enemies.push({
          type: row.type, hp: ENEMY_DEF[row.type].hp,
          fx, fy,                  // 대형 내 목표 위치
          x: W / 2 + side * (W / 2 + 40), y: -40 - r * 30 - i * 12,
          state: 'enter',          // enter | formation | dive
          t: 0, entryDelay: (r * row.count + i) * 0.06,
          dive: null, w: 24, h: 20, wobble: Math.random() * Math.PI * 2,
        });
      }
    });
  }

  // ---------- 유틸 ----------
  const rectHit = (a, b) =>
    Math.abs(a.x - b.x) < (a.w + b.w) / 2 && Math.abs(a.y - b.y) < (a.h + b.h) / 2;

  function explode(x, y, color, n = 14) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = Math.random() * 140 + 40;
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.5 + Math.random() * 0.4, color });
    }
  }

  function startGame() {
    score = 0; lives = 3; wave = 1;
    bullets = []; enemyBullets = []; particles = [];
    player.x = W / 2; player.dead = false; player.invincible = 2; player.cooldown = 0;
    buildWave(wave);
    diveTimer = 2.5;
    state = STATE.PLAYING;
  }

  function nextWave() {
    wave++;
    bullets = []; enemyBullets = [];
    buildWave(wave);
    diveTimer = 2;
    state = STATE.PLAYING;
  }

  function playerHit() {
    if (player.dead || player.invincible > 0) return;
    explode(player.x, player.y, '#ffffff', 28);
    beep(200, 0.5, 'sawtooth', 0.12, -160);
    player.dead = true;
    player.respawnTimer = 1.8;
    lives--;
    if (lives < 0) {
      state = STATE.GAMEOVER;
      if (score > hiScore) { hiScore = score; localStorage.setItem('galaga_hi', String(hiScore)); }
    }
  }

  // ---------- 업데이트 ----------
  function update(dt) {
    // 별
    for (const s of stars) { s.y += s.v * dt * (state === STATE.PLAYING ? 1 : 0.3); if (s.y > H) { s.y = 0; s.x = Math.random() * W; } }
    // 파티클
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
    particles = particles.filter(p => p.life > 0);

    if (state !== STATE.PLAYING) return;

    formationT += dt;

    // 플레이어
    if (player.dead) {
      player.respawnTimer -= dt;
      if (player.respawnTimer <= 0 && lives >= 0) { player.dead = false; player.x = W / 2; player.invincible = 2.5; }
    } else {
      if (player.invincible > 0) player.invincible -= dt;
      if (keys.ArrowLeft || keys.KeyA) player.x -= player.speed * dt;
      if (keys.ArrowRight || keys.KeyD) player.x += player.speed * dt;
      player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x));
      player.cooldown -= dt;
      if ((keys.Space || keys.KeyZ) && player.cooldown <= 0 && bullets.length < 3) {
        bullets.push({ x: player.x, y: player.y - 14, w: 3, h: 12, vy: -520 });
        player.cooldown = 0.22;
        beep(880, 0.08, 'square', 0.05, -300);
      }
    }

    // 플레이어 탄
    for (const b of bullets) b.y += b.vy * dt;
    bullets = bullets.filter(b => b.y > -20);

    // 적 탄
    for (const b of enemyBullets) { b.x += b.vx * dt; b.y += b.vy * dt; }
    enemyBullets = enemyBullets.filter(b => b.y < H + 20 && b.x > -20 && b.x < W + 20);

    // 적
    const swayX = Math.sin(formationT * 0.9) * 22;
    const speedMul = 1 + (wave - 1) * 0.12;
    let allInFormation = true;

    for (const e of enemies) {
      e.t += dt;
      e.wobble += dt * 4;
      const tx = e.fx + swayX, ty = e.fy;

      if (e.state === 'enter') {
        allInFormation = false;
        if (e.t < e.entryDelay) continue;
        // 곡선 진입: 목표를 향해 부드럽게
        const dx = tx - e.x, dy = ty - e.y;
        const d = Math.hypot(dx, dy);
        const sp = 300 * speedMul;
        if (d < sp * dt) { e.x = tx; e.y = ty; e.state = 'formation'; }
        else {
          const curl = Math.sin(e.t * 3) * 120; // 좌우로 휘어지는 느낌
          e.x += (dx / d) * sp * dt + curl * dt;
          e.y += (dy / d) * sp * dt;
        }
      } else if (e.state === 'formation') {
        e.x = tx; e.y = ty;
      } else if (e.state === 'dive') {
        allInFormation = false;
        const dv = e.dive;
        dv.t += dt;
        // 베지어 곡선으로 급강하 후 화면 아래로, 이후 위에서 다시 대형 복귀
        if (dv.phase === 0) {
          const u = Math.min(1, dv.t / dv.dur);
          const p0 = dv.p0, p1 = dv.p1, p2 = dv.p2, p3 = dv.p3;
          const mt = 1 - u;
          e.x = mt*mt*mt*p0.x + 3*mt*mt*u*p1.x + 3*mt*u*u*p2.x + u*u*u*p3.x;
          e.y = mt*mt*mt*p0.y + 3*mt*mt*u*p1.y + 3*mt*u*u*p2.y + u*u*u*p3.y;
          // 급강하 중 사격
          dv.shootT -= dt;
          if (dv.shootT <= 0 && e.y < player.y - 60 && !player.dead) {
            dv.shootT = 0.9 + Math.random() * 0.6;
            const ang = Math.atan2(player.y - e.y, player.x - e.x);
            const sp = 200 + wave * 12;
            enemyBullets.push({ x: e.x, y: e.y + 8, w: 4, h: 10, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp });
            beep(300, 0.1, 'triangle', 0.04, -100);
          }
          if (u >= 1) { dv.phase = 1; e.y = -30; e.x = tx; }
        } else {
          // 위에서 대형 복귀
          const dx = tx - e.x, dy = ty - e.y, d = Math.hypot(dx, dy);
          const sp = 220 * speedMul;
          if (d < sp * dt) { e.x = tx; e.y = ty; e.state = 'formation'; e.dive = null; }
          else { e.x += (dx / d) * sp * dt; e.y += (dy / d) * sp * dt; }
        }
      }
    }

    // 급강하 개시
    diveTimer -= dt;
    if (diveTimer <= 0 && !player.dead) {
      const candidates = enemies.filter(e => e.state === 'formation');
      if (candidates.length) {
        const count = Math.min(candidates.length, 1 + Math.floor(Math.random() * Math.min(3, 1 + wave / 2)));
        for (let i = 0; i < count; i++) {
          const e = candidates.splice(Math.floor(Math.random() * candidates.length), 1)[0];
          const dir = e.x < W / 2 ? 1 : -1;
          e.state = 'dive';
          e.dive = {
            t: 0, phase: 0, shootT: 0.5 + Math.random() * 0.5,
            dur: (2.6 - Math.min(1.0, wave * 0.1)) / speedMul,
            p0: { x: e.x, y: e.y },
            p1: { x: e.x + dir * (120 + Math.random() * 80), y: e.y - 60 },
            p2: { x: player.x + (Math.random() - 0.5) * 200, y: H * 0.55 },
            p3: { x: player.x + dir * -40 + (Math.random() - 0.5) * 80, y: H + 40 },
          };
        }
      }
      diveTimer = Math.max(0.7, 2.4 - wave * 0.15) + Math.random() * 0.8;
    }

    // 대형에서의 산발적 사격 (웨이브 높을수록 빈도 증가)
    if (!player.dead && Math.random() < dt * (0.25 + wave * 0.08)) {
      const f = enemies.filter(e => e.state === 'formation');
      if (f.length) {
        const e = f[Math.floor(Math.random() * f.length)];
        enemyBullets.push({ x: e.x, y: e.y + 10, w: 4, h: 10, vx: 0, vy: 180 + wave * 10 });
      }
    }

    // 충돌: 플레이어 탄 vs 적
    for (const b of bullets) {
      for (const e of enemies) {
        if (e.hp <= 0) continue;
        if (rectHit(b, e)) {
          b.y = -100;
          e.hp--;
          if (e.hp <= 0) {
            const def = ENEMY_DEF[e.type];
            score += e.state === 'dive' ? def.diveScore : def.score;
            explode(e.x, e.y, def.color, 16);
            beep(e.type === 0 ? 120 : 220, 0.25, 'sawtooth', 0.08, -80);
          } else {
            explode(e.x, e.y, '#ffffff', 5);
            beep(500, 0.06, 'square', 0.04);
          }
          break;
        }
      }
    }
    enemies = enemies.filter(e => e.hp > 0);
    bullets = bullets.filter(b => b.y > -50);

    // 충돌: 적/적탄 vs 플레이어
    if (!player.dead) {
      for (const b of enemyBullets) {
        if (rectHit(b, player)) { b.y = H + 100; playerHit(); break; }
      }
      for (const e of enemies) {
        if (e.state === 'dive' && rectHit(e, player)) {
          e.hp = 0; explode(e.x, e.y, ENEMY_DEF[e.type].color, 16);
          score += ENEMY_DEF[e.type].score;
          playerHit(); break;
        }
      }
      enemies = enemies.filter(e => e.hp > 0);
    }

    // 웨이브 클리어
    if (enemies.length === 0 && state === STATE.PLAYING) {
      state = STATE.WAVE_CLEAR; stateTimer = 2.2;
      beep(660, 0.15, 'square', 0.06); setTimeout(() => beep(880, 0.15, 'square', 0.06), 150); setTimeout(() => beep(1320, 0.3, 'square', 0.06), 300);
    }
  }

  // ---------- 그리기 ----------
  function drawPlayer(x, y) {
    ctx.save(); ctx.translate(x, y);
    // 본체
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-2, -14, 4, 8);
    ctx.fillRect(-6, -8, 12, 10);
    ctx.fillRect(-14, 0, 28, 6);
    ctx.fillRect(-12, 6, 6, 4); ctx.fillRect(6, 6, 6, 4);
    // 빨강 포인트
    ctx.fillStyle = '#ff3b3b';
    ctx.fillRect(-14, -2, 4, 4); ctx.fillRect(10, -2, 4, 4);
    // 파랑 조종석
    ctx.fillStyle = '#4cb8ff';
    ctx.fillRect(-2, -6, 4, 4);
    ctx.restore();
  }

  function drawEnemy(e) {
    const def = ENEMY_DEF[e.type];
    ctx.save(); ctx.translate(e.x, e.y);
    const flap = Math.sin(e.wobble) > 0 ? 1 : 0;
    if (e.type === 0) { // 보스: 넓은 몸통 + 뿔
      ctx.fillStyle = def.color2;
      ctx.fillRect(-12, -4, 24, 10);
      ctx.fillStyle = def.color;
      ctx.fillRect(-6, -10, 12, 8);
      ctx.fillRect(-14 - flap*2, -2, 5, 8); ctx.fillRect(9 + flap*2, -2, 5, 8);
      ctx.fillStyle = '#ffd24c';
      ctx.fillRect(-4, -8, 3, 3); ctx.fillRect(1, -8, 3, 3);
      if (e.hp === 1) { ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(-12, -10, 24, 16); }
    } else if (e.type === 1) { // 나비
      ctx.fillStyle = def.color;
      ctx.fillRect(-3, -9, 6, 18);
      ctx.fillRect(-12, -6 + flap*2, 9, 8); ctx.fillRect(3, -6 + flap*2, 9, 8);
      ctx.fillStyle = def.color2;
      ctx.fillRect(-12, 2 + flap*2, 5, 5); ctx.fillRect(7, 2 + flap*2, 5, 5);
      ctx.fillStyle = '#ffd24c';
      ctx.fillRect(-2, -8, 4, 3);
    } else { // 벌
      ctx.fillStyle = def.color;
      ctx.fillRect(-4, -8, 8, 16);
      ctx.fillRect(-11, -3 - flap*2, 7, 6); ctx.fillRect(4, -3 - flap*2, 7, 6);
      ctx.fillStyle = '#ffd24c';
      ctx.fillRect(-4, -2, 8, 3); ctx.fillRect(-4, 4, 8, 2);
      ctx.fillStyle = def.color2;
      ctx.fillRect(-3, -7, 2, 2); ctx.fillRect(1, -7, 2, 2);
    }
    ctx.restore();
  }

  function drawText(txt, x, y, size = 16, color = '#e8e8ff', align = 'center') {
    ctx.fillStyle = color; ctx.font = `bold ${size}px "Courier New", monospace`;
    ctx.textAlign = align; ctx.textBaseline = 'middle';
    ctx.fillText(txt, x, y);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    // 별
    for (const s of stars) {
      ctx.fillStyle = s.s > 1.4 ? '#bcd0ff' : '#5a6a99';
      ctx.fillRect(s.x, s.y, s.s, s.s);
    }
    // 파티클
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / 0.9);
      ctx.fillStyle = p.color; ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
    }
    ctx.globalAlpha = 1;

    if (state === STATE.TITLE) {
      drawText('GALAGA', W / 2, H * 0.33, 52, '#ffd24c');
      drawText('갤 러 그', W / 2, H * 0.33 + 44, 22, '#4cb8ff');
      drawText('ENTER 또는 SPACE 를 눌러 시작', W / 2, H * 0.58, 15);
      drawText('← → 이동   SPACE 발사', W / 2, H * 0.58 + 26, 13, '#99a');
      drawText(`HI-SCORE  ${String(hiScore).padStart(6, '0')}`, W / 2, H * 0.78, 14, '#ff4c6a');
      // 점수표
      const yy = H * 0.86;
      drawEnemy({ type: 0, x: W/2 - 90, y: yy, wobble: 0 }); drawText('150', W/2 - 60, yy, 12, '#99a', 'left');
      drawEnemy({ type: 1, x: W/2 - 10, y: yy, wobble: 0 }); drawText('80', W/2 + 20, yy, 12, '#99a', 'left');
      drawEnemy({ type: 2, x: W/2 + 60, y: yy, wobble: 0 }); drawText('50', W/2 + 90, yy, 12, '#99a', 'left');
      return;
    }

    // 적
    for (const e of enemies) drawEnemy(e);
    // 탄
    ctx.fillStyle = '#ffffff';
    for (const b of bullets) ctx.fillRect(b.x - 1.5, b.y - 6, 3, 12);
    ctx.fillStyle = '#ff6a8a';
    for (const b of enemyBullets) ctx.fillRect(b.x - 2, b.y - 5, 4, 10);
    // 플레이어
    if (!player.dead && (player.invincible <= 0 || Math.floor(player.invincible * 12) % 2 === 0)) drawPlayer(player.x, player.y);

    // HUD
    drawText('1UP', 16, 14, 13, '#ff4c6a', 'left');
    drawText(String(score).padStart(6, '0'), 16, 32, 15, '#fff', 'left');
    drawText('HI-SCORE', W / 2, 14, 13, '#ff4c6a');
    drawText(String(Math.max(hiScore, score)).padStart(6, '0'), W / 2, 32, 15, '#fff');
    drawText(`WAVE ${wave}`, W - 16, 14, 13, '#4cb8ff', 'right');
    for (let i = 0; i < lives; i++) { ctx.save(); ctx.scale(0.6, 0.6); drawPlayer((W - 20 - i * 24) / 0.6, 36 / 0.6); ctx.restore(); }

    if (state === STATE.PAUSED) {
      ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
      drawText('PAUSED', W / 2, H / 2, 32, '#ffd24c');
      drawText('P 키로 계속', W / 2, H / 2 + 34, 14);
    } else if (state === STATE.WAVE_CLEAR) {
      drawText(`WAVE ${wave} CLEAR!`, W / 2, H / 2 - 10, 28, '#4cff6a');
      drawText('다음 웨이브 준비 중...', W / 2, H / 2 + 24, 14);
    } else if (state === STATE.GAMEOVER) {
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
      drawText('GAME OVER', W / 2, H / 2 - 20, 36, '#ff4c6a');
      drawText(`SCORE  ${String(score).padStart(6, '0')}`, W / 2, H / 2 + 22, 16);
      if (score >= hiScore && score > 0) drawText('NEW HI-SCORE!', W / 2, H / 2 + 46, 14, '#ffd24c');
      drawText('ENTER 로 재시작', W / 2, H / 2 + 80, 14, '#99a');
    }
  }

  // ---------- 루프 ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (state === STATE.WAVE_CLEAR) {
      stateTimer -= dt;
      update(dt);
      if (stateTimer <= 0) nextWave();
    } else {
      update(dt);
    }
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- 입력 ----------
  window.addEventListener('keydown', (ev) => {
    if (['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(ev.code)) ev.preventDefault();
    keys[ev.code] = true;
    if (ev.code === 'Enter' || (ev.code === 'Space' && state !== STATE.PLAYING && state !== STATE.PAUSED)) {
      if (state === STATE.TITLE || state === STATE.GAMEOVER) { startGame(); return; }
    }
    if (ev.code === 'KeyP' || ev.code === 'Escape') {
      if (state === STATE.PLAYING) state = STATE.PAUSED;
      else if (state === STATE.PAUSED) { state = STATE.PLAYING; last = performance.now(); }
    }
  });
  window.addEventListener('keyup', (ev) => { keys[ev.code] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === STATE.PLAYING) state = STATE.PAUSED; });

  // 터치 버튼
  const bind = (id, code) => {
    const el = document.getElementById(id);
    const on = (ev) => { ev.preventDefault(); keys[code] = true; if (code === 'Space' && (state === STATE.TITLE || state === STATE.GAMEOVER)) startGame(); };
    const off = (ev) => { ev.preventDefault(); keys[code] = false; };
    el.addEventListener('touchstart', on, { passive: false }); el.addEventListener('touchend', off);
    el.addEventListener('mousedown', on); el.addEventListener('mouseup', off); el.addEventListener('mouseleave', off);
  };
  bind('tl', 'ArrowLeft'); bind('tr', 'ArrowRight'); bind('tf', 'Space');
  canvas.addEventListener('pointerdown', () => { if (state === STATE.TITLE || state === STATE.GAMEOVER) startGame(); });

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
