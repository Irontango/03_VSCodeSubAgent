name: galaga-deploy

# main 브랜치에 갤러그 변경이 머지되면 GitHub Pages로 배포한다.
# 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 설정해야 동작한다.
on:
  push:
    branches: [main]
    paths:
      - 'games/galaga/**'
      - '.github/workflows/galaga-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: games/galaga

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/galaga/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: games/galaga/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
