name: galaga-ci

on:
  pull_request:
    paths:
      - 'games/galaga/**'
      - '.github/workflows/galaga-ci.yml'
  push:
    branches: [main]
    paths:
      - 'games/galaga/**'
      - '.github/workflows/galaga-ci.yml'

defaults:
  run:
    working-directory: games/galaga

jobs:
  check:
    name: lint · typecheck · unit · build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/galaga/package-lock.json

      - run: npm ci

      - name: Lint (ESLint + Prettier)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & integration tests
        run: npm test

      - name: Build single-file bundle
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: games/galaga/playwright-report
          retention-days: 7

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: galaga-dist
          path: games/galaga/dist/index.html
          retention-days: 14
